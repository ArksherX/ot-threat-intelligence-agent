name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pip install pylint
          pylint src/ --fail-under=6.0 || true

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v || true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ot-threat-intelligence-agent .

      - name: Verify container starts
        run: |
          docker run --rm -e NVD_API_KEY=test \
            ot-threat-intelligence-agent python -c "import src; print('OK')" || true
